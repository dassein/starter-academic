[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.80.0"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# Preserve previously shared resume links after renaming the download.
[[redirects]]
  from = "/files/resume/Zhankun_s_Resume.pdf"
  to = "/files/resume/Zhankun_Luo_Resume.pdf"
  status = 301

# Preserve old antithetic project and image URLs after moving the page bundle.
[[redirects]]
  from = "/project/antithetic/*"
  to = "/publication/antithetic/:splat"
  status = 301

# Preserve previously shared academic CV links after moving the download.
[[redirects]]
  from = "/Zhankun_Luo_Academic_CV.pdf"
  to = "/files/CV/Zhankun_Luo_Academic_CV.pdf"
  status = 301

# Preserve previously shared slides links after moving the download.
[[redirects]]
  from = "/files/project/Zhankun_GroupMeet_251118.pdf"
  to = "/publication/antithetic/Zhankun_GroupMeet_251118.pdf"
  status = 301
